<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172b22">
<meta name="description" content="ブラウザで遊べる小さなボクセル・サンドボックスゲーム">
<title>Voxel World — ブロックの世界</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <div id="game"></div>
  <section id="overlay" class="panel">
    <div class="brand">VOXEL <span>WORLD</span></div>
    <h1>自分だけの世界を作ろう</h1>
    <p>ブロックを置いたり、壊したり。小さな3Dサンドボックス。</p>
    <button id="startButton" class="primary">ワールドを始める</button>
    <p class="hint">PC：WASDで移動・マウスで視点操作・クリックでブロック操作<br>タッチ端末：画面左下で移動・右側をドラッグで視点操作</p>
  </section>
  <header id="hud" class="hidden">
    <div class="hud-title">VOXEL <span>WORLD</span></div>
    <div class="hud-help">タップ／クリック：ブロックを壊す　長押し／右クリック：置く</div>
    <button id="saveButton">保存</button>
  </header>
  <div id="crosshair" class="hidden">＋</div>
  <div id="hotbar" class="hidden" aria-label="ブロック選択"></div>
  <div id="touchControls" class="hidden">
    <div class="pad">
      <button data-move="forward">▲</button>
      <div class="pad-row"><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div>
    </div>
    <div class="touch-actions"><button id="breakButton">壊す</button><button id="placeButton">置く</button><button id="jumpButton">ジャンプ</button></div>
  </div>
  <div id="toast" role="status"></div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
